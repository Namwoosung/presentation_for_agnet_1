r-bottom:3px solid var(--runtime);padding-bottom:10px}.appendix-content{height:690px;display:grid;grid-template-columns:270px 1fr;gap:35px}.appendix-tabs{display:flex;flex-direction:column;gap:8px;overflow:auto}.appendix-tabs button{text-align:left;font-size:20px}.appendix-tabs button[aria-selected=true]{border-color:var(--runtime);color:white}.appendix-view{font-size:26px;line-height:1.65;overflow:auto;padding:10px 15px;overscroll-behavior:contain}.appendix-view table{width:100%;border-collapse:collapse;font-size:23px}.appendix-view th,.appendix-view td{border-bottom:1px solid var(--line);padding:14px 16px;text-align:left;vertical-align:top}.appendix-view th{color:var(--memory)}.appendix-view pre{font-size:22px;white-space:pre-wrap}.appendix-view p{margin:0 0 20px}.appendix-view .pager{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:19px}.appendix-view button{font-size:20px}.status{color:var(--memory);font-size:20px;margin-top:20px}.diagram-caption{font-size:17px;fill:var(--muted)}.presenter{max-width:1250px;margin:auto;padding:35px;font-size:18px;line-height:1.8}.presenter h1{font-size:28px}.presenter .next{color:var(--memory)}.presenter .note{white-space:pre-wrap}.presenter .mini{width:100%;height:220px;border:1px solid var(--line)}.reduced *{transition:none!important;animation:none!important}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media print{body{background:white}#controls,dialog{display:none!important}#stage{height:auto;display:block}.slide{transform:none!important;break-after:page;width:1920px;height:1080px}.pending{opacity:1}.appendix-view{overflow:visible} @page{size:20in 11.25in;margin:0}}

<script>window.SEMINAR={"slides":[{"id":"S00","section":"Opening","priority":"핵심","title":"같은 Agent 구성요소, 다른 실행 책임","onScreen":["Agent Framework · Inside the Runtime","7개 기술의 실행 구조와 개발·운영 판단","누가 판단하고, 실행하고, 저장하고, 복구하는가?"],"visual":"중앙 제목, 아래 일곱 기술명을 작고 동등한 크기로 배치. ① 제목 ② 다섯 동사 ③ Hermes·PydanticAI만 밑줄 강조. 로고·기능 카드 벽은 사용하지 않는다.","buildSteps":["제목","다섯 동사","Hermes·PydanticAI만 밑줄 강조"],"speakerNotes":"“기초와 Tool·Orchestration은 이미 배웠습니다. 오늘은 같은 이름의 기능이 실제 제품에서 어떤 책임으로 구현되는지 보겠습니다.” 다음 장에서 일곱 기술의 위치를 먼저 구분한다.","sourceRefs":"C 독자 안내, §§1–3, 39. 디자인 D S01/A-2만 참고.","appendixLinks":[],"body":"","version":"2026-10-31 분석 기준"},{"id":"S01","section":"Opening","priority":"핵심","title":"일곱 기술은 같은 층위의 경쟁 제품이 아닙니다","onScreen":["완성형 Harness: Hermes · Claude Code","실행 Framework/SDK: PydanticAI · OpenAI · ADK · Microsoft","Claude Agent SDK → Claude Code Runtime","제품명보다 실제 제어권을 비교합니다"],"visual":"2개 묶음+SDK→CLI 연결의 위치도. 아래 Model/Provider/Environment를 공통 의존 영역으로 배치. ① Harness 묶음 ② 조립형 묶음 ③ Claude SDK 연결 ④ 상호 배타적 분류가 아니라는 작은 설명. 성숙도·성능 축처럼 보이는 좌표축을 넣지 않는다.","buildSteps":["Harness 묶음","조립형 묶음","Claude SDK 연결","상호 배타적 분류가 아니라는 작은 설명"],"speakerNotes":"“SDK 안에도 Runner가 있고 Framework 안에도 Harness가 있습니다. 특히 Claude Code와 Claude SDK는 독립 엔진 두 개가 아닙니다.” 네 제품을 완전히 같은 개발 인터페이스라고 단정하지 않는다. PydanticAI Harness 등 선택적 계층은 뒤에서 별도 설명한다.","sourceRefs":"C §§1, 1.1, 2, 24–29.","appendixLinks":[],"body":"","version":"2026-10-31 분석 기준"},{"id":"S02","section":"Opening","priority":"핵심","title":"비교 기준은 기능 개수가 아니라 다섯 가지 소유권입니다","onScreen":["행동: 누가 다음 단계를 결정하나?","상태: 무엇을 어디에 남기나?","권한: 누가 실행을 허가하나?","복구: 실패하면 무엇을 다시 하나?","근거: 어디까지 코드로 보이나?"],"visual":"왼쪽 질문 5개, 오른쪽 이후 구조도의 작은 기준 축. ① 행동/상태 ② 권한/복구 ③ 근거. 구석에 `SRC · DOC · INF · UNV` 범례만 둔다.","buildSteps":["행동/상태","권한/복구","근거"],"speakerNotes":"일반 Agent 구조를 다시 강의하지 않는다. “이 질문을 일곱 기술에 반복해 적용하면 무엇을 기본으로 받고 무엇을 직접 만들어야 하는지 보입니다.” 근거 수준은 판단의 범위이며 제품 점수가 아니다.","sourceRefs":"C 독자 안내, §§2–3, 37.1.","appendixLinks":[],"body":"","version":"2026-10-31 분석 기준"},{"id":"S03","section":"Hermes","priority":"핵심","title":"Hermes는 작업 실행에 필요한 환경을 함께 제공합니다","onScreen":["AIAgent Loop","Prompt · Tools · Memory · Session","Gateway · Cron · 실행 Backend","완성형 Harness의 공개 구현을 읽습니다"],"visual":"`arch-hermes` 전체도. 위 Host(CLI/Gateway/Cron) → 중앙 AIAgent → 오른쪽 Provider/Model 및 Tool Executor/Backend, 왼쪽 Prompt Builder·Memory·Skills, 아래 SQLite Session/FTS5. Registry/MCP/Plugin은 Tool 확장 영역에 둔다. ① 입력/Loop ② 모델/도구 ③ Context/저장 ④ Gateway/Cron·정책 경계. Context와 저장소를 같은 박스로 합치지 않는다.","buildSteps":["입력/Loop","모델/도구","Context/저장","Gateway/Cron·정책 경계"],"speakerNotes":"“작은 Agent 클래스만 제공하는 접근과 달리 일상 작업의 실행 환경을 묶습니다. 그래서 빠르게 연결할 수 있는 기능이 많지만 정책·설정·영속성의 이해 부담도 커집니다.” 다음은 중앙 Loop 확대다.","sourceRefs":"C §§1–2, 4.1, 23; 공식 링크 G-H.","appendixLinks":[],"body":"","version":"v0.22.5"},{"id":"S04","section":"Hermes","priority":"핵심","title":"Hermes의 Tool 요청은 저장·실행·결과 기록으로 이어집니다","onScreen":["run_conversation → 요청 준비 → Provider 호출","응답 분류 → Tool Intent 저장 → Handler 실행","Tool Result 기록 → 다음 호출 / 종료","기록과 외부 실행의 연결을 확인합니다"],"visual":"S03 Loop를 확대하여 Model/Runtime/Store/Tool 4레인 시퀀스. ① 모델 요청·응답 ② Intent 저장 ③ Handler 실행·결과 저장 ④ 다음 반복·최종 분기. 별도 작은 Stop 가지에 예산/취소/정책/오류를 배치한다. Intent 기록만으로 외부 실행과 원자적 트랜잭션이 완성된 것처럼 그리지 않는다.","buildSteps":["모델 요청·응답","Intent 저장","Handler 실행·결과 저장","다음 반복·최종 분기"],"speakerNotes":"`conversation_loop.py`, `turn_*.py`, `turn_tool_round.py`는 실제 소스 식별자다. 이 그림은 축약 대표 경로다. “모델이 말한 것, 실제 실행한 것, 저장된 것은 다른 사건입니다. 중간에 장애가 나면 어느 사건까지 완료됐는지 알아야 합니다.” 복구의 일반 문제는 S33으로 회수한다.","sourceRefs":"C §§4.1, 5, 23, 33; G-H.","appendixLinks":[],"body":"","version":"v0.22.5"},{"id":"S05","section":"Hermes","priority":"핵심","title":"Hermes의 Prompt는 세션·도구·기억과 함께 구성됩니다","onScreen":["stable → context → volatile","지침 · Tool Schema · Skill · History · 검색 결과","저장된 정보 전체가 매번 전송되지는 않습니다"],"visual":"`arch-hermes`의 Prompt Builder 확대. 상단에 논리 계층, 하단 Provider Request 상자. ① 안정 지침 ② 프로젝트/사용자 맥락 ③ 선택된 정보·최근 이력 ④ Provider별 표현 변환. 물리적인 API 필드 순서를 확정하는 도식으로 그리지 않는다. `stable/context/volatile`과 A–I 분석 항목은 서로 다른 분해 관점이라고 노트에 둔다.","buildSteps":["안정 지침","프로젝트/사용자 맥락","선택된 정보·최근 이력","Provider별 표현 변환"],"speakerNotes":"“다음 모델 호출에 무엇이 들어가는지 보려면 Prompt Builder뿐 아니라 History와 Tool 목록, Provider 변환도 함께 봐야 합니다.” 모든 구성 요소가 매번 로드된다는 연출을 피한다. SOP가 바뀌면 갱신 시점이 어디인지 질문하고 S06으로 연결한다.","sourceRefs":"C §§10–10.1, 11.1, 23; G-H prompt_builder.py.","appendixLinks":[],"body":"","version":"v0.22.5"},{"id":"S06","section":"Hermes","priority":"핵심","title":"캐시는 계산을 재사용하고, 압축은 입력을 다시 편집합니다","onScreen":["Prefix Cache: 동일 Prefix의 계산 재사용","Compaction: 현재 입력의 선택·요약·축약","캐시 효율과 정보 신선도를 함께 봅니다"],"visual":"좌우 55:45. 왼쪽 동일 Prefix와 새로운 suffix의 두 요청, 오른쪽 긴 History→요약+최근 결과+원문 참조. ① 같은 Prefix의 재전송 ② 제공자 hit일 때 재사용 ③ 앞부분 변경 시 영향 ④ 압축 전후와 신선도 질문. 설명 숫자는 C의 `10k+2k → 10k reuse+3k`만 사용하고 `개념 예시·실측 아님`을 붙인다. 장식용 속도 그래프는 금지한다.","buildSteps":["같은 Prefix의 재전송","제공자 hit일 때 재사용","앞부분 변경 시 영향","압축 전후와 신선도 질문"],"speakerNotes":"캐시는 입력 전송 생략과 다르며 TTL·가격·집계·지원은 Provider에 종속된다. 압축과 영구 삭제는 다른 행위다. 보존 정책·Tool Call/Result 쌍·원문 ID를 확인해야 한다. “SOP-r3를 고정해 캐시가 잘 맞아도 지금 r4를 써야 한다면 올바른 운영이 아닙니다.” 이는 설계 예시다.","sourceRefs":"C §§11–11.2, 14–14.1, 31 F13/F16. 상세 기법 X04.","appendixLinks":["X04"],"body":"","version":"v0.22.5"},{"id":"S07","section":"Hermes","priority":"핵심","title":"Hermes의 Memory와 대화 검색은 다른 경로입니다","onScreen":["SQLite Session: 이전 대화와 실행 기록","FTS5: 단어·구문 중심 검색","MEMORY.md / USER.md: 선별된 지속 정보","FTS5 ≠ Vector Search · RAG는 검색 활용 패턴"],"visual":"Store를 Session DB, Fact Files, Skills로 분리하고 현재 Context에 대한 별도 읽기 화살표를 둔다. ① 대화 저장 ② FTS 검색 ③ 선별 기억 주입 ④ Vector/Hybrid가 필요한 질문. FTS를 RAG 바깥의 반대편으로 배치하지 않는다.","buildSteps":["대화 저장","FTS 검색","선별 기억 주입","Vector/Hybrid가 필요한 질문"],"speakerNotes":"“장비·Alarm ID의 정확한 용어 검색과 다른 표현으로 적힌 설명 검색은 평가 조건이 다릅니다.” 이는 선택 질문이며 특정 검색 방식의 우승을 의미하지 않는다. 대규모 전문 Corpus 요구가 개인 세션 회상으로 자동 해결되지는 않는다. 데이터·Tokenizer·인덱스와 원문 추적을 함께 본다.","sourceRefs":"C §§12–13.1, 23, 31 F14/F15. 여섯 저장 범주 X04.","appendixLinks":["X04"],"body":"","version":"v0.22.5"},{"id":"S08","section":"Hermes","priority":"확장","title":"Skill·Tool·MCP·Plugin은 서로 다른 확장 책임입니다","onScreen":["Skill: 절차와 참고 자료","Tool: 실행 기능","MCP: 기능을 연결하는 프로토콜","Plugin: 호스트 Runtime의 확장 규약","자동 생성한 절차도 검증은 필요합니다"],"visual":"`Skill → Context → Model → Tool 요청 → Runtime` 경로에 Local Handler와 MCP Server 두 실행 경로를 둔다. Plugin은 별도 테두리로 Registry/Hook 확장을 연결한다. ① 절차 입력 ② Tool 실행 ③ MCP 경계 ④ Plugin 개입. 한 기능이 두 경로로 등록될 수 있다는 충돌 질문은 노트에만 둔다.","buildSteps":["절차 입력","Tool 실행","MCP 경계","Plugin 개입"],"speakerNotes":"일반 용어 정의를 재강의하지 말고 Hermes가 통합한 확장점으로 연결한다. Skill 생성→품질 검증→승인·버전→배포는 C의 설계 권고이며 제품 기본 자동 파이프라인이 아니다. 모델 가중치 재학습으로 설명하지 않는다.","sourceRefs":"C §§15–15.2, 23. Skill 품질 파이프라인 X05.","appendixLinks":["X05"],"body":"","version":"v0.22.5"},{"id":"S09","section":"Hermes","priority":"핵심","title":"Hermes의 병렬 Tool과 Subagent는 다른 실행 단위입니다","onScreen":["Tool Round: 순차·병렬 구간과 충돌 장벽","Subagent: 별도 Loop·Context·권한·예산","결과 순서 고정만으로 공유 파일 충돌은 해결되지 않습니다"],"visual":"위쪽 한 모델 응답의 A/B/C Tool 구간, 아래 부모→자식 Loop→부모 반환. ① 여러 호출 제안 ② 실행 구간·충돌 장벽 ③ Child ID/Parent Link ④ 공유 파일·비용·취소의 경계. 독립 Context를 OS 격리 컨테이너로 표현하지 않는다.","buildSteps":["여러 호출 제안","실행 구간·충돌 장벽","Child ID/Parent Link","공유 파일·비용·취소의 경계"],"speakerNotes":"C는 ThreadPoolExecutor 계열과 세그먼트/배리어를 설명한다. 정확한 하위 실행기 이름·Worker 수를 새로 만들지 않는다. “같은 Snapshot의 독립 조회는 병렬 후보지만, 같은 파일을 고치는 두 도구는 다른 문제입니다.” Parent가 Child 결과를 받아 통합·재검증할 책임을 설명한다.","sourceRefs":"C §§7–8.2, 23, 31 F04/F19/F20. 전체 병렬성 표 X03.","appendixLinks":["X03"],"body":"","version":"v0.22.5"},{"id":"S10","section":"Hermes","priority":"확장","title":"Hermes를 활용해도 권한과 운영 정책은 확인해야 합니다","onScreen":["Tool Policy / Approval ≠ OS·DB 권한","Gateway: 사용자·세션·결과 전달","Cron: 미래의 Agent Run 기동","통합 기능은 운영 책임의 출발점입니다"],"visual":"S03 전체도 재등장. ① Tool 게이트·Backend 권한 ② Gateway 사용자/세션 라우팅 ③ Cron→새 Run→결과 전달 ④ 무인 실행 시 정책 질문. Cron을 현재 모델 Loop 안의 반복 화살표로 넣지 않는다.","buildSteps":["Tool 게이트·Backend 권한","Gateway 사용자/세션 라우팅","Cron→새 Run→결과 전달","무인 실행 시 정책 질문"],"speakerNotes":"“조회 도구라고 해도 어느 사용자의 어떤 Lot까지 조회 가능한지는 따로 강제해야 합니다. 예약 실행에서 사람이 없을 때 승인을 어떻게 처리할지도 정책입니다.” 멀티테넌트 격리·중복 Job·배송 보장은 확인할 문제이지 기본 완전 보장이 아니다.","sourceRefs":"C §§16–17, 19, 20.2, 23. 운영 비교는 S34–S35.","appendixLinks":[],"body":"","version":"v0.22.5"},{"id":"S11","section":"Hermes","priority":"연결","title":"Demo 1: Hermes의 실제 요청과 실행을 연결해 봅니다","onScreen":["① 모델에 실제 전달된 내용","② Tool 선택·정책·실행·결과","③ 다음 Context와 저장 상태","관찰 질문: 어느 사건이 다음 반복을 만들었나?"],"visual":"왼쪽 `arch-hermes` 축소판, 오른쪽 관찰 포인트 3개. ① 요청 ② Tool 왕복 ③ 저장/다음 호출 ④ `별도 Demo 1` 버튼(설정된 경우만 활성). Trace 자체는 슬라이드에 내장하지 않는다.","buildSteps":["요청","Tool 왕복","저장/다음 호출","`별도 Demo 1` 버튼(설정된 경우만 활성)"],"speakerNotes":"C는 실험·반도체 데모 구현을 제외한다. 따라서 이 장은 기존 발표 요구를 위한 연결 명세이며 C에 실측 결과가 있다는 뜻이 아니다. 별도 구현 후 실제 run ID·모델·버전이 있는 기록을 관찰한다. 없으면 설명용 도식만 사용한다. 복귀 후 “완성형 Harness의 다른 선택”으로 Claude Code에 연결한다.","sourceRefs":"C §§4.1, 10, 22–23, Appendix B1. 데모 제작 계약 F.","appendixLinks":[],"body":"","version":"v0.22.5"},{"id":"S12","section":"Claude Code","priority":"핵심","title":"Claude Code는 공개된 Harness 계약을 중심으로 비교합니다","onScreen":["CLI Harness → Model · Tools · Subagents","Project Instructions · Auto Memory · Skills · Session","Permissions · Hooks · Sandbox","핵심 엔진 내부 전체는 공개 소스로 확인되지 않습니다"],"visual":"`arch-claude-code` 전체도. Host→CLI Runtime 경계 안에 Context·Tool·Session·Permission 논리 영역, 바깥에 Model/Workspace/MCP. ① 전체 관계 ② 지침·기억 ③ 권한·도구 ④ 비공개 경계. `공식 동작 계약` 레이블을 고정한다. 가상의 내부 함수명을 붙이지 않는다.","buildSteps":["전체 관계","지침·기억","권한·도구","비공개 경계"],"speakerNotes":"Hermes와 비교할 것은 완성형 Harness의 통합 범위다. 차이는 공개 소스로 추적 가능한 깊이와 저수준 변경 범위에 있다. `CLAUDE.md`, 설정에 따른 `AGENTS.md`, Auto Memory, Skills는 같은 저장물로 합치지 않는다.","sourceRefs":"C §§4.6, 10.1, 12.1, 28; G-C.","appendixLinks":[],"body":"","version":"CLI v2.1.314"},{"id":"S13","section":"Claude Code","priority":"핵심","title":"Claude Code의 협업과 권한은 사용 계약으로 읽어야 합니다","onScreen":["Subagent ↔ Agent Teams: 협업 계약을 구분","Permission Rule · PreToolUse · Sandbox: 다른 경계","지침·절차 재사용의 편의와 내부 변경 제약을 함께 봅니다"],"visual":"좌측 Parent→Child→Parent와 팀 관계를 개념 비교, 우측 Tool 앞 Hook·Permission과 실행 Backend의 경계를 배치. ① 위임 구조 ② 팀 구조 ③ 권한 위치. Teams의 자세한 메시지 순서·스레드·보장·명령을 C에 없는 수준으로 확정하지 않는다.","buildSteps":["위임 구조","팀 구조","권한 위치"],"speakerNotes":"“정해진 작업 환경을 재사용하는 장점이 있습니다. 다만 Hook에 기록이 찍힌 것과 Backend에서 실제 차단한 것은 다릅니다.” 실용 명령은 버전별 확인 후 보조 노트에 추가할 수 있지만, 이 원문에 없는 slash command 목록을 제작자가 임의 보강하지 않는다. 다음은 직접 Agent를 구성하는 Python Framework다.","sourceRefs":"C §§7.1, 8.1, 16.1, 28. 공개 계약 경계 X01/G-C.","appendixLinks":["X01"],"body":"","version":"CLI v2.1.314"},{"id":"S14","section":"PydanticAI","priority":"핵심","title":"PydanticAI는 실행 경로에 검증 계약을 결합합니다","onScreen":["Python 타입·검증 → Agent 실행 계약","Agent → 내부 Graph → Model / ToolManager / Output","Core · Capabilities · 별도 Harness를 구분합니다"],"visual":"`arch-pydantic` 전체도. Agent 설정/Dependencies → Core 내부 Graph, 오른쪽 Model/Provider와 ToolManager→Tools, 아래 History/Output Validator, 바깥 Capabilities/별도 Harness·외부 저장/Host. ① 타입·검증 기반 짧은 안내 ② Core 전체 ③ 확장 계층 ④ 개발자 책임. 독립 사용자 Workflow Graph는 별도 영역으로 둔다.","buildSteps":["타입·검증 기반 짧은 안내","Core 전체","확장 계층","개발자 책임"],"speakerNotes":"Pydantic의 긴 기초 수업은 하지 않는다. “잘못된 구조의 출력을 어떻게 수정할지, 도구와 출력을 어떤 순서로 처리할지까지 실행 계약과 연결합니다.” Core 버전과 Harness 버전을 같게 가정하지 않는다.","sourceRefs":"C §§1, 4.2, 24, 35 각주, Appendix A3; G-P.","appendixLinks":[],"body":"","version":"Core v2.61.0"},{"id":"S15","section":"PydanticAI","priority":"핵심","title":"내부 Graph는 모델 요청과 Tool 처리의 경계를 드러냅니다","onScreen":["UserPromptNode → ModelRequestNode → CallToolsNode","Tool Result / Retry → 다음 ModelRequestNode","유효한 최종 결과 → End","내부 Graph ≠ 사용자 Workflow Graph"],"visual":"위 실제 Node 이름을 가진 3노드+End 상태도. ① 입력 준비 ② Model 요청 ③ Tool/Output 분류·검증 ④ 반복/종료. 각 Edge에 원문의 분기 의미를 적는다. `Agent.run / Agent.iter`는 진입 API로 별도 표시한다.","buildSteps":["입력 준비","Model 요청","Tool/Output 분류·검증","반복/종료"],"speakerNotes":"Graph라는 단어만으로 LangGraph나 분산 내구성 Workflow라고 설명하지 않는다. “이 내부 구조는 모델 요청과 도구 처리의 경계를 읽기 좋게 드러냅니다. 업무 Graph의 설계와는 별개입니다.” 모든 Node 세부 필드·5개 실행 API 등 원문이 상세히 다루지 않은 내용은 이번 본문에 새 사실로 추가하지 않는다.","sourceRefs":"C §§4.2, 9, 24. 실제 소스 G-P `_agent_graph.py`.","appendixLinks":[],"body":"","version":"Core v2.61.0"},{"id":"S16","section":"PydanticAI","priority":"핵심","title":"Tool Schema·Deps·실행 인가는 같은 계약이 아닙니다","onScreen":["타입 기반 Schema → 모델의 호출 요청","ToolManager → 인자 검증·실행 경로","Dependencies → 실행 자원·테스트 대체","형식에 맞는 DB ID도 비인가일 수 있습니다"],"visual":"Model/ToolManager/App Policy/Tool Backend 레인. ① Schema 노출 ② 모델 Call ③ 검증+정책 경계 ④ 실행 결과. Dependencies는 Python 실행 경계에서 필요한 객체로 그리며 자동으로 Prompt 전체에 복사하는 선을 넣지 않는다. 최종 요청 포함 여부의 상세는 Adapter/사용 코드 확인 사항으로 노트에 둔다.","buildSteps":["Schema 노출","모델 Call","검증+정책 경계","실행 결과"],"speakerNotes":"C의 Pydantic 기반 Tool·Output 계약과 Dependencies를 중심으로 설명한다. “형식 검증은 입력을 해석할 수 있는지를, 인가는 이 사용자가 그 자원에 접근해도 되는지를 다룹니다.” Lot 접근 통제는 [INF] 앱 설계 예시다. 원문의 인자·결과 형식 검증 설명을 모든 도구 반환값의 자동 Pydantic 사실 검증으로 넓히지 않는다.","sourceRefs":"C §§6–6.2, 16.1, 24, 31 F02; G-P tool_manager.py/tools.py.","appendixLinks":[],"body":"","version":"Core v2.61.0"},{"id":"S17","section":"PydanticAI","priority":"핵심","title":"최종 출력과 Tool이 함께 나오면 종료 정책이 중요해집니다","onScreen":["한 응답에 Final 후보 + Function Tool","early · graceful · exhaustive","출력 처리와 Tool 실행 정책이 달라집니다","타입 통과는 수치의 진실성을 보장하지 않습니다"],"visual":"한 모델 응답에서 최종 후보와 Tool A/B가 나오는 갈림길. ① 공존 상황 ② 세 정책 이름 ③ “무엇이 이미 실행됐나?” 질문 ④ 출력 형식과 내용 정확성 분리. C는 전략별 세부 순서표를 제공하지 않으므로 이름만 보고 실행 순서를 임의로 애니메이션하지 않는다. X02에 확인할 조건을 둔다.","buildSteps":["공존 상황","세 정책 이름","“무엇이 이미 실행됐나?” 질문","출력 형식과 내용 정확성 분리"],"speakerNotes":"“EndStrategy는 단순 화면 옵션이 아니라 Final과 도구 처리가 만나는 지점의 정책입니다. 실제 부작용이 발생하는 경로를 봐야 합니다.” 원문 이상의 기본값·전략별 정확한 취소 시점은 주장하지 않는다. 세부 시연은 고정 버전 구현 확인 후 별도 기록에 근거해 채운다.","sourceRefs":"C §§4.2, 5, 24, 31 F05/F06; G-P `_agent_graph.py`/`_tool_execution.py`/`_output.py`.","appendixLinks":["X02"],"body":"","version":"Core v2.61.0"},{"id":"S18","section":"PydanticAI","priority":"핵심","title":"검증 Retry와 병렬 장벽은 실행 비용과 부작용을 바꿉니다","onScreen":["Validation Retry: 수정된 요청을 다시 생성","Transport / Tool / Node Retry는 다른 범위","sequential 장벽: 순서 제약을 표현","이미 시작한 외부 작업은 별도로 확인합니다"],"visual":"위 4종 Retry의 재실행 범위, 아래 병렬 조회 A/B→장벽→의존 작업 C. ① 검증 실패→모델 피드백 ② 네트워크/Tool/Node와 차이 ③ 장벽 ④ 취소와 부작용. 고정 지연·비용 수치는 넣지 않는다.","buildSteps":["검증 실패→모델 피드백","네트워크/Tool/Node와 차이","장벽","취소와 부작용"],"speakerNotes":"“비동기로 실행한다고 안전한 병렬 처리가 되는 것은 아닙니다. 결과가 같은 Snapshot인지, 앞 결과에 의존하는지부터 봐야 합니다.” Retry가 반복될수록 추가 호출·중복 작업이 생길 수 있으므로 예산·멱등성을 함께 설명한다. 특정 함수에 몇 회 재시도가 기본인지는 C 밖의 사실이다.","sourceRefs":"C §§5.1, 7–7.3, 24, 31 F03/F04/F06. 전체 비교 X03.","appendixLinks":["X03"],"body":"","version":"Core v2.61.0"},{"id":"S19","section":"PydanticAI","priority":"핵심","title":"Core·Capabilities·Harness와 앱의 책임을 구분합니다","onScreen":["Core: 실행·도구·출력 계약","Capabilities / Hooks: 실행 개입 지점","Harness: 별도 계층·구성","Host · 장기 저장 · 도메인 권한은 설계가 필요합니다"],"visual":"S14 전체도 재등장. ① Core ② Capabilities ③ 별도 Harness ④ 앱의 외부 저장/Auth/Serving 경계. 표는 “원문에서 다룬 역할”만 기입하고 모든 Memory·Skill·Shell 기능을 기본 탑재로 체크하지 않는다.","buildSteps":["Core","Capabilities","별도 Harness","앱의 외부 저장/Auth/Serving 경계"],"speakerNotes":"“개발자는 실행을 전부 처음부터 만드는 대신 계약과 개입 지점을 사용할 수 있습니다. 하지만 무엇을 보존하고 누가 승인하며 어떻게 서비스할지는 정해야 합니다.” Core만으로 모든 것이 자동 해결되거나 Memory를 무조건 전부 수동 구현한다는 결론을 피한다. Harness 구체 패키지 기능 목록·버전은 이번 C에서 확정되지 않은 범위다.","sourceRefs":"C §§10.1, 12.1, 16.1, 20.2, 24, 35 각주, Appendix A3.","appendixLinks":[],"body":"","version":"Core v2.61.0"},{"id":"S20","section":"PydanticAI","priority":"핵심","title":"Deferred 승인은 중단된 요청을 다시 연결하는 계약입니다","onScreen":["DeferredToolRequests → 외부 승인/실행 → DeferredToolResults","Pending은 최종 실패가 아닙니다","요청 ID · 승인자 · 인자 · 버전 · 만료를 연결합니다"],"visual":"모델 Tool 요청→Pending→외부 결정→재검증→결과 반영의 상태도. ① 요청 보관 ② 승인자 결정 ③ 변경 여부 검사 ④ Run 이어가기/거절. SDK 제공 수단은 보라, [INF] 앱 책임 항목은 중립 점선 영역으로 구분한다. 원문의 `execute once` 표기를 SDK의 Exactly-once 보장으로 옮기지 않는다.","buildSteps":["요청 보관","승인자 결정","변경 여부 검사","Run 이어가기/거절"],"speakerNotes":"“보고서 v1을 승인한 뒤 내용이 v2로 바뀌었다면 같은 승인일까요?” 정확한 인자와 버전 결합은 설계 권고다. 승인 UI·내구 저장·프로세스 재시작을 모두 자동 제공한다고 주장하지 않는다. UI가 아니라 수명과 재개 계약이 핵심이다.","sourceRefs":"C §§17–17.1, 18.1, 24, 31 F08/F09. 상세 상태 계약 X06.","appendixLinks":["X06"],"body":"","version":"Core v2.61.0"},{"id":"S21","section":"PydanticAI","priority":"연결","title":"Demo 2: 개발 코드와 내부 실행 경계를 함께 봅니다","onScreen":["① Agent · Tool · 출력 계약","② 내부 Graph · 검증 · Retry","③ 승인 · History · 제어권","관찰 질문: SDK가 해준 일과 앱이 구현한 일은 무엇인가?"],"visual":"좌측 개발자 작성 범위, 우측 S14의 Core 경계. ① Tool→Schema→Call ② Node 전이와 결과 ③ 관찰 가능한 실제 분기 ④ `별도 Demo 2` 링크. 아직 없는 로그·구현 화면을 완성된 것처럼 삽입하지 않는다.","buildSteps":["Tool→Schema→Call","Node 전이와 결과","관찰 가능한 실제 분기","`별도 Demo 2` 링크"],"speakerNotes":"동일 도메인 질문에 대해 Core 최소 실행을 먼저 관찰하고, 실제 검증한 경우에만 선택 Harness 확장으로 넘어간다. EndStrategy 재현은 자연 LLM 실행과 Scripted Runtime 시험을 구분해야 한다. 다음은 같은 조립형 접근에서도 명시적 NextStep을 중심으로 읽는 OpenAI SDK다.","sourceRefs":"C §§4.2, 22–24, Appendix B1. 데모 제작 계약 F.","appendixLinks":[],"body":"","version":"Core v2.61.0"},{"id":"S22","section":"OpenAI Agents SDK","priority":"핵심","title":"OpenAI SDK는 다음 실행을 NextStep으로 나눕니다","onScreen":["Agent + Runner + Tools + Session / RunState","ProcessedResponse → NextStep","FinalOutput · RunAgain · Handoff · Interruption"],"visual":"`arch-openai` 전체도. Host→Runner, Model/Tools/Guardrails, 아래 Session/RunState/Tracing을 먼저 보여준 뒤 Turn Resolver 확대. ① 전체 구조 ② 응답 처리 ③ NextStep ④ 저장/반환. `Interruption`은 상태 의미이며 원문에 명시되지 않은 정확한 클래스명을 만들어 넣지 않는다.","buildSteps":["전체 구조","응답 처리","NextStep","저장/반환"],"speakerNotes":"PydanticAI의 내부 Node 전이와 비교하여 “응답을 다음 실행의 자료형으로 분류하는 설계”를 강조한다. Tool 결과를 직접 최종 출력으로 채택하는 경우에는 후속 모델 해석을 생략하는 선택과 한계를 설명한다. 완성형 Gateway·Scheduler·Sandbox를 모두 주는 제품이라고 하지 않는다.","sourceRefs":"C §§4.3, 5, 25; G-O.","appendixLinks":[],"body":"","version":"Python v0.24.0"},{"id":"S23","section":"OpenAI Agents SDK","priority":"핵심","title":"Agent-as-Tool은 결과를 돌려주고 Handoff는 제어권을 넘깁니다","onScreen":["as_tool: Specialist 결과 → Manager → Final","Handoff: Agent A → Agent B → Final / 다음 이관","Workflow: Scheduler가 다음 경로를 관리"],"visual":"3개 수평 레인, 동일한 전문 Agent와 Manager 아이콘 사용. ① Manager 중심 ② 활성 담당자 변경 ③ 코드/Graph 경로. “최종 답변 책임” 표식을 각 레인에 다른 위치로 이동한다. 모든 Handoff를 새 OS 프로세스로 그리지 않는다.","buildSteps":["Manager 중심","활성 담당자 변경","코드/Graph 경로"],"speakerNotes":"“공정 전문가의 분석 결과만 받아 종합할지, 사용자 후속 대화까지 그 전문가가 맡을지의 차이입니다.” 이 도메인 예시는 설계 해석이다. 다른 제품의 Delegation이라는 단어만 보고 native Handoff와 동일시하지 않는다. Context 전달 범위·Child 예산·취소는 각각 확인해야 한다.","sourceRefs":"C §§8–9, 25, 30. 추가 Subagent 책임 X03.","appendixLinks":["X03"],"body":"","version":"Python v0.24.0"},{"id":"S24","section":"OpenAI Agents SDK","priority":"핵심","title":"OpenAI Guardrail과 RunState는 적용 범위를 구분해야 합니다","onScreen":["Input Guardrail: 병행 실행 여부 확인","Output Guardrail: 이전 Tool 부작용을 되돌리지 않음","Function Tool Guardrail ≠ 모든 도구의 공통 게이트","RunState ≠ Conversation Session"],"visual":"위 Guardrail과 모델/Tool의 병행 시간축, 아래 승인 Pending→RunState와 Session History 두 저장물. ① 검사 시점 ② 도구 유형 범위 ③ 승인·재개 상태. 검사 완료 전 진행 가능성을 보여주되 모든 구성에서 실제 위험 Tool이 실행된다고 단정하지 않는다.","buildSteps":["검사 시점","도구 유형 범위","승인·재개 상태"],"speakerNotes":"정책 검사의 적용 대상·시점·실패 전파를 확인한다. `pre_approval_tool_input_guardrails`는 원문에 있는 구성 예시이며 정확한 인자 코드는 넣지 않는다. “검사 지원”을 사전 부작용 차단의 완전 보장으로 바꾸지 않는다.","sourceRefs":"C §§16.1–16.3, 17.1, 18, 25, 31 F07. G-O Guardrails/RunState.","appendixLinks":[],"body":"","version":"Python v0.24.0"},{"id":"S25","section":"Claude Agent SDK","priority":"핵심","title":"Claude Agent SDK는 Python과 CLI Runtime 사이를 연결합니다","onScreen":["query / ClaudeSDKClient → InternalClient","SubprocessCLITransport ↔ Claude Code CLI","Control Protocol · Hooks · Permissions · SDK MCP","공개 SDK 코드와 CLI 내부 Loop는 다른 범위입니다"],"visual":"`arch-claude-sdk` 전체도. Python 프로세스/CLI 프로세스/외부 Model·Workspace를 세 경계로 배치. ① API→Transport ② CLI Runtime ③ Control Callback 반환 ④ 메시지 파서·ResultMessage. Python이 직접 모든 내장 Tool을 실행하는 선을 그리지 않는다.","buildSteps":["API→Transport","CLI Runtime","Control Callback 반환","메시지 파서·ResultMessage"],"speakerNotes":"“애플리케이션에 완성된 Harness를 포함하는 접근입니다. 공개 코드는 통신과 프로세스 수명, 콜백 연결을 읽는 좋은 자료지만 내부 모델 Loop 전체의 공개 증거는 아닙니다.” S12와 같은 CLI Runtime 컴포넌트를 재사용한다.","sourceRefs":"C §§1, 4.7, 29; G-S.","appendixLinks":[],"body":"","version":"Python v0.2.176 / CLI v2.1.316"},{"id":"S26","section":"Claude Agent SDK","priority":"확장","title":"SDK가 소유하는 것은 프로세스·스트림·콜백의 수명입니다","onScreen":["query ↔ 지속 연결 Client: 수명 비교","SDK-hosted MCP ↔ CLI 내장 Tool: 실행 위치 비교","SessionStore ↔ CLI Transcript: 저장 경계 비교","Host는 자원·취소·세션 격리를 관리합니다"],"visual":"S25 경계도에 lifecycle 막대와 MCP 왕복을 겹쳐 확대한다. ① 단발/연결 수명 ② Python Tool Callback ③ Session/Store ④ Host 책임. 호출당 프로세스 수 등 C에 없는 보장을 숫자로 쓰지 않는다.","buildSteps":["단발/연결 수명","Python Tool Callback","Session/Store","Host 책임"],"speakerNotes":"`allowed_tools`를 모든 실행의 완전한 whitelist로 취급하지 않는다. 콜백 호출 여부는 실제 정책 경로에 달린다. 대화 저장·파일·산출물·인증은 다른 이관 준비물이다. 실제 조합 제약은 코드 확인 후 추가할 수 있으나 이번 원문에 없는 세부를 확정하지 않는다.","sourceRefs":"C §§4.7, 12.1, 16.1, 20.2, 29; G-S query/client/transport/session_resume.","appendixLinks":[],"body":"","version":"Python v0.2.176 / CLI v2.1.316"},{"id":"S27","section":"Google ADK","priority":"핵심","title":"ADK는 Flow의 실행과 Runner의 이벤트 관리를 나눕니다","onScreen":["Runner: Session · Invocation · Event 관리","LlmAgent / BaseLlmFlow: 요청·모델·도구 반복","Session · Memory · Artifact Service는 별도 계약"],"visual":"`arch-adk` 전체도. Host→Runner→LlmAgent/BaseLlmFlow→Model·Tool Batch, Event가 Runner와 SessionService로 흐른다. MemoryService·ArtifactService는 Context/근거 공급 영역으로 분리한다. ① 전체 구조 ② Flow 반복 ③ Event 전달·저장 ④ 서비스 분리.","buildSteps":["전체 구조","Flow 반복","Event 전달·저장","서비스 분리."],"speakerNotes":"C §4.4는 축약 대표 경로이므로 실제 최신 Node 함수가 모두 이 이름으로 직렬 호출된다고 설명하지 않는다. “실행을 만드는 층과 상태 변화를 이벤트로 전달·저장하는 층을 나눠 읽습니다.” 상세 Graph와 전통 Workflow는 다음 장에서 구분한다.","sourceRefs":"C §§4.4, 10.1, 12.1, 26; G-G.","appendixLinks":[],"body":"","version":"Python v2.13.0"},{"id":"S28","section":"Google ADK","priority":"핵심","title":"ADK의 Final Event는 업무 전체 완료와 다를 수 있습니다","onScreen":["개별 Agent final ≠ 전체 Workflow 완료","Event · State Delta · Artifact를 연결","전통 Agent Tree/Workflow와 별도 Graph 구분","순서·중복·Resume의 범위를 확인합니다"],"visual":"두 Agent의 시간축에서 Agent A final 뒤 B/Join이 남은 그림. ① 개별 final ② 전체 완료 조건 ③ Event/State와 Artifact ID ④ Workflow 경로 구분. 현재 구체 API가 구현된 것처럼 가상의 workflow-complete 이벤트 타입을 만들지 않는다.","buildSteps":["개별 final","전체 완료 조건","Event/State와 Artifact ID","Workflow 경로 구분"],"speakerNotes":"“BIN 분석 한 단계가 말을 마쳤다고 보고서가 준비된 것은 아닙니다. 어떤 Snapshot·Artifact를 모아 완료로 볼지 업무 기준이 필요합니다.” `temp:`와 영구 상태, Graph checkpoint의 세부 재개 범위는 코드 추적 대상으로 노트에 둔다. 보편적인 완전 복구 보장으로 표현하지 않는다.","sourceRefs":"C §§4.4, 9, 18.2–18.3, 26, 31 F10. G-G event/session/workflows.","appendixLinks":[],"body":"","version":"Python v2.13.0"},{"id":"S29","section":"Microsoft Agent Framework","priority":"핵심","title":"Microsoft에는 Tool·Harness·Workflow 반복이 겹쳐 있습니다","onScreen":["Agent → RawAgent → Context Providers → ChatClient","① Function Invocation Tool Loop","② Harness의 Agent 재호출","③ Workflow의 Executor · Edge · Superstep"],"visual":"`arch-maf` 전체도. 중앙 Pipeline에 Tool Loop, 그 바깥 Harness Loop, 옆 별도 Workflow Scheduler를 둔다. ① 전체 Pipeline ② 모델↔Tool 반복 ③ 상위 Agent 재호출 ④ Workflow 반복. 동심원이 같은 매 실행마다 모두 활성화된다는 오해를 피하려고 선택 구성 선을 점선으로 표시한다.","buildSteps":["전체 Pipeline","모델↔Tool 반복","상위 Agent 재호출","Workflow 반복"],"speakerNotes":"“한 개의 while 루프로 비교하면 반복의 위치와 종료 기준을 놓칩니다.” Agent·Chat·Function Middleware를 각 실제 계층에 표시한다. Python 분석을 다른 언어 구현의 동일 동작으로 일반화하지 않는다.","sourceRefs":"C §§4.5, 9, 27; G-M.","appendixLinks":[],"body":"","version":"Python python-1.24.0"},{"id":"S30","section":"Microsoft Agent Framework","priority":"핵심","title":"Middleware는 어느 단계에서 정책을 강제하는지가 중요합니다","onScreen":["Agent / Chat / Function: 개입 단위가 다릅니다","Tool 오류와 정책 거절의 전파를 구분합니다","최종 실행 인자를 기준으로 승인·인가합니다"],"visual":"세 Middleware 층을 Pipeline 위에 표시. 오른쪽에 일반 Tool Error→결과/예외 정책과 `MiddlewareFailure`→중단/거절의 비교 경로. ① 위치 ② 오류 분류 ③ 승인한 인자와 실행 인자의 비교. 정책 인자 변경 사례는 [INF] 설계 예시로 둔다.","buildSteps":["위치","오류 분류","승인한 인자와 실행 인자의 비교"],"speakerNotes":"“권한 거절을 모델이 수정해 다시 도전할 일반 오류로만 돌리면 정책 경계가 약해질 수 있습니다.” C가 설명한 전파 차이를 유지하며 모든 예외가 항상 하나의 경로로 처리된다고 단정하지 않는다. FIDES는 실험적이며 완전 보안의 근거가 아니다.","sourceRefs":"C §§16.1, 16.4, 17, 27, 31 F08/F24; G-M `_middleware.py`.","appendixLinks":[],"body":"","version":"Python python-1.24.0"},{"id":"S31","section":"Microsoft Agent Framework","priority":"확장","title":"Superstep과 Checkpoint는 외부 트랜잭션이 아닙니다","onScreen":["Executor · Edge · Superstep · Checkpoint","Workflow 상태 복원 ≠ 외부 변경의 원자적 처리","병렬 결과는 업무 키와 버전으로 결합합니다"],"visual":"Source A/B→Join→다음 Superstep, 아래 Checkpoint와 별도 외부 DB. ① 분기/결합 ② 저장 경계 ③ 외부 성공과 checkpoint 사이 장애 틈. 같은 Executor 순서와 다른 분기 도착 순서를 혼동하지 않는다.","buildSteps":["분기/결합","저장 경계","외부 성공과 checkpoint 사이 장애 틈"],"speakerNotes":"업무 키 예시는 `LOT-A + snapshot-v1 + SOP-r3`다. 이는 Join 설계 제안이며 MAF가 이 키를 자동 제공한다는 뜻이 아니다. Graph/Functional은 다른 구성 접근이며 세부 코드는 부록·소스에 둔다. 다음은 기술별 저장물을 같은 질문으로 비교한다.","sourceRefs":"C §§9, 18.1–18.3, 27, 34.1; G-M `_workflows/_runner.py`/`_checkpoint.py`.","appendixLinks":[],"body":"","version":"Python python-1.24.0"},{"id":"S32","section":"개발·운영 판단","priority":"핵심","title":"같은 ‘저장’이라도 다시 답할 수 있는 질문이 다릅니다","onScreen":["Transcript: 무엇을 대화했나?","RunState: 어디서 멈췄나?","Event / Checkpoint: 무엇이 바뀌고 어디서 재개하나?","Memory: 다음에도 무엇을 기억하나?","Side-effect Journal: 실제 외부 변경은 무엇인가?"],"visual":"5개 질문과 저장물, 각 행의 대표 기술 예시만 표시. ① 대화/기억 ② 실행 중단 ③ Event/Checkpoint ④ 외부 변경. 제품별 7열 체크표는 넣지 않는다.","buildSteps":["대화/기억","실행 중단","Event/Checkpoint","외부 변경"],"speakerNotes":"“Session을 DB에 저장했다고 승인 대기 위치까지 복원되는 것은 아니고, Checkpoint가 있다고 외부 보고서 발행 이력까지 자동 일치하지도 않습니다.” 저장물끼리 연결할 ID와 source of truth는 앱 계약이다. 여섯 범주의 정확한 표는 X04/X06.","sourceRefs":"C §§12, 17–18, 22.","appendixLinks":["X04","X06"],"body":"","version":"2026-10-31 분석 기준"},{"id":"S33","section":"개발·운영 판단","priority":"핵심","title":"복구 후 같은 Tool을 실행해도 되는지는 별도 판단입니다","onScreen":["외부 Tool 성공 → 응답 기록 전 Crash","Checkpoint 복원 → Tool 재호출?","멱등 키 · 완료 조회 · 조정/보상","Resume ≠ Exactly-once"],"visual":"C의 이체 예를 A-5의 가상 `publish_report`로 치환한 시퀀스. ① Intent 저장 ② 외부 성공 ③ Crash ④ 복원과 중복 후보 ⑤ 멱등/조회 경로. 고정 애니메이션은 설명 사례이며 실제 장애 재현 로그로 표시하지 않는다.","buildSteps":["Intent 저장","외부 성공","Crash","복원과 중복 후보","멱등/조회 경로"],"speakerNotes":"“안전한 복구는 저장 위치만이 아니라 외부 시스템의 계약에 달립니다.” Outbox/Inbox·멱등성·Reconciliation은 C의 설계 대안이며 일곱 제품이 동일하게 기본 제공하는 기능이 아니다. Intent 저장도 외부 API와 원자적으로 묶이는 것은 아니다.","sourceRefs":"C §§18.1–18.2, 31 F09/F11, 33.","appendixLinks":[],"body":"","version":"2026-10-31 분석 기준"},{"id":"S34","section":"개발·운영 판단","priority":"확장","title":"Cron·Background·Queue·Resume는 다른 실행 계약입니다","onScreen":["Cron: 언제 시작할까?","Background: 누가 계속 소유할까?","Queue: 어떻게 전달·재시도할까?","Resume: 어디서 이어갈까?","무인 실행 정책과 중복·누락을 확인합니다"],"visual":"Trigger→Job→Run→State→Delivery의 수명선, 각 개념이 관여하는 위치만 강조. ① 예약 ② 분리 작업 ③ 전달/Retry ④ 재개. 단일 원형 “자동화” 아이콘으로 합치지 않는다.","buildSteps":["예약","분리 작업","전달/Retry","재개"],"speakerNotes":"Hermes는 스케줄·Agent Run·전달을 통합한다. 다른 SDK의 외부 Scheduler 조합은 예약 불가능과 다르다. `(job_id, scheduled_for)`, 이전 작업 overlap 정책, Catch-up, DLQ, Interactive Approval 부재는 [INF] 선택 질문이다.","sourceRefs":"C §§19–19.1, 23, 34.","appendixLinks":[],"body":"","version":"2026-10-31 분석 기준"},{"id":"S35","section":"개발·운영 판단","priority":"핵심","title":"응답 전달과 Agent 실행 상태는 분리해야 합니다","onScreen":["부분 Token → Agent Final → 정책·저장 → Client 수신","동기 HTTP / Streaming / Job API","연결 단절이 Tool 취소를 뜻하지는 않습니다"],"visual":"위 4개 완료 시점, 아래 Client→Auth/Session Router→Worker→Model/Tool/Store 구조. ① token ② final ③ commit ④ delivery. 작은 inset으로 중앙 Agent vs 로컬 Agent+중앙 LLM의 배치를 비교한다. 후자는 [INF] 배치 대안이며 특정 제품의 완성 기능으로 표시하지 않는다.","buildSteps":["token","final","commit","delivery"],"speakerNotes":"중앙형은 인증·Tenant·Session, 예산·Worker/Tool 동시성, 영속 상태·취소·감사를 설계한다. 로컬형은 설치·업데이트·자격증명·파일 권한·정책 버전 동기화 책임을 검토한다. 사용자 수·GPU 수·프로세스 수를 근거 없이 추정하지 않는다. 상세 비교는 X09.","sourceRefs":"C §§20–20.4, 21–22, 36. 배치 대안은 원문의 Host 책임을 적용한 [INF].","appendixLinks":["X09"],"body":"","version":"2026-10-31 분석 기준"},{"id":"S36","section":"개발·운영 판단","priority":"핵심","title":"모델 교체는 URL보다 기능 계약을 먼저 확인해야 합니다","onScreen":["Tool Calling · Schema / Structured Output","Streaming · Cancellation · Error / Retry","Token Accounting · Cache · Parallel Calls","OpenAI-compatible ≠ 모든 기능 동일"],"visual":"Runtime→Provider Adapter/Profile/Client→모델 Gateway의 경계. ① 요청 형식 ② 도구/출력 ③ Stream/취소 ④ 비용·Cache. 일곱 제품의 상세 Provider 목록 대신 기능 호환 질문을 표시한다.","buildSteps":["요청 형식","도구/출력","Stream/취소","비용·Cache"],"speakerNotes":"Hermes Provider Resolver, PydanticAI Model/Profile, OpenAI Responses/Chat 경로, ADK Adapter, MAF ChatClient, Claude CLI 지원 옵션처럼 평가 경계가 다르다. “로컬 vLLM 연결도 해당 서버·모델·템플릿의 기능을 별도 확인해야 합니다.” 엔진 내부 최적화 강의로 확대하지 않는다.","sourceRefs":"C §21, Appendix B1. 기능 점검 표 X09.","appendixLinks":["X09"],"body":"","version":"2026-10-31 분석 기준"},{"id":"S37","section":"개발·운영 판단","priority":"핵심","title":"Trace로 경로를 설명하고 네 층의 평가로 검증합니다","onScreen":["Contract → Scripted Runtime → Integration → Task Eval","Model · Tool · Turn · Context · Policy · Workflow · Host","형식·경로·연결·업무 품질을 분리합니다"],"visual":"왼쪽 연결 ID를 가진 이벤트 타임라인, 오른쪽 네 평가 층. ① Schema/Serializer ② Scripted 분기 ③ 실제 Provider/DB/MCP ④ 정답·근거·비용·정책. 네 층을 자동으로 모두 통과한 것처럼 체크하지 않는다.","buildSteps":["Schema/Serializer","Scripted 분기","실제 Provider/DB/MCP","정답·근거·비용·정책"],"speakerNotes":"“Trace는 원인을 찾는 기록이고 Eval은 성공 기준입니다. 타입을 통과해도 수치가 틀릴 수 있고 Scripted 모델로 분기를 재현해도 실제 LLM의 과제 성공률이 입증되지는 않습니다.” 로그에는 Tool 인자·근거·정책 버전을 연결하되 비밀정보를 가린다. 비공개 추론 원문을 요구하지 않는다.","sourceRefs":"C §§22–22.1, Appendix B1.","appendixLinks":[],"body":"","version":"2026-10-31 분석 기준"},{"id":"S38","section":"개발·운영 판단","priority":"핵심","title":"직접 만든다면 제품보다 책임 인터페이스를 가져옵니다","onScreen":["RunCoordinator · ModelGateway · ContextBuilder","ToolCatalog · PolicyEngine · ToolExecutor · StateStore","principal · deadline · expected_version · idempotency_key"],"visual":"C §32 참조 아키텍처를 상위 7개 책임으로 축약. Host→Coordinator→Context/Model, Resolver→Catalog/Policy/Executor, Coordinator↔Store, Trace 관찰선. ① 입력/실행 조율 ② 모델/Context ③ 정책/Tool ④ 상태/감사. 상단에 `INF · 참조 설계`를 고정한다.","buildSteps":["입력/실행 조율","모델/Context","정책/Tool","상태/감사"],"speakerNotes":"“프레임워크를 새로 전부 만들자는 결론은 아닙니다. 기존 기술을 사용하더라도 누가 이 책임을 수행하는지 적어보자는 뜻입니다.” optimistic concurrency, 멱등성, 실행 주체, deadline이 Tool 호출 함수만으로 해결되지 않는 문제를 드러낸다. 전체 Protocol과 의사코드는 X08.","sourceRefs":"C §§32–33. 실제 제품 아키텍처와 구분한다.","appendixLinks":["X08"],"body":"","version":"2026-10-31 분석 기준"},{"id":"S39","section":"개발·운영 판단","priority":"핵심","title":"선택은 요구조건과 반대급부의 조합입니다","onScreen":["통합 실행 환경 ↔ 조립 가능한 실행 계약","자율 Tool 선택 ↔ 명시적 Workflow","Event 이력 ↔ 빠른 Snapshot 복원","자율 Memory ↔ 승인된 지식·버전 관리"],"visual":"성능 순위 대신 4개 선택 행. 각 행 오른쪽에 `얻는 것 / 추가 책임`을 한 쌍으로 둔다. ① 작업 조건 ② 비교할 쌍 ③ 필수 검증 ④ 선택 보류 조건. 제품별 ◎ 점수는 본문에 쓰지 않는다.","buildSteps":["작업 조건","비교할 쌍","필수 검증","선택 보류 조건"],"speakerNotes":"C §34 요구사항 표를 사용한다. 예: 완성형 작업 환경은 Hermes/Claude Code, 명시적 Runner/Typed 계약은 OpenAI/PydanticAI, Event/Workflow는 ADK/MAF, CLI 삽입은 Claude SDK가 비교 기준이 된다. 이는 후보 검토 지점이며 산업용 선정 결과가 아니다. 전체 연구 적합성 표는 X09에서 원문 범례와 함께만 공개한다.","sourceRefs":"C §§30, 34–36.","appendixLinks":["X09"],"body":"","version":"2026-10-31 분석 기준"},{"id":"S40","section":"개발·운영 판단","priority":"핵심","title":"맡길 책임과 우리가 지킬 계약을 결정합시다","onScreen":["① Loop와 제어권의 소유자를 확인한다","② 상태·권한·복구의 경계를 확인한다","③ 우리 데이터·정책·평가로 검증한다","Next: 실제 도메인 Agent의 설계와 재현"],"visual":"S01 기술 지도가 작게 재등장하고 중앙에 3개 결론. ① 실행 책임 ② 운영 계약 ③ 검증. 마지막에는 제품명보다 책임 경계를 밝게 남긴다.","buildSteps":["실행 책임","운영 계약","검증"],"speakerNotes":"“누가 더 많은 기능을 갖췄는지보다, 우리 요구에서 맡길 수 있는 책임과 남는 책임을 설명할 수 있어야 합니다. 다음 단계에서는 데이터·권한·성공 기준을 고정한 Agent로 이 선택을 검증하겠습니다.” 1차의 “다음은 Tools/Orchestration” 멘트를 재사용하지 않는다. Q&A 운영은 실제 세미나 진행 방식에 맞추며 일반 청중용 빈 Q&A 장을 자동 추가하지 않는다.","sourceRefs":"C §§36, 39, 최종 메시지.","appendixLinks":[],"body":"","version":"2026-10-31 분석 기준"},{"id":"X01","section":"부록","priority":"핵심","title":"7개 실행 경로와 공개 경계","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§2, 4.1–4.7, 37.1, Appendix A.","appendixLinks":[],"body":"\n**화면:** `Loop를 누가 소유하는가?`와 기술 선택 탭. **그림:** 왼쪽 전체 구조 축소, 오른쪽 아래 경로, 하단 공개 범위. **조작:** 기술 선택→경로 단계 강조→출처 열기. 복귀는 호출한 장으로 돌아간다.\n\n| 기술 | 표시할 대표 경로 | 경계 |\n|---|---|---|\n| Hermes | run_conversation → preflight/request → Provider → response validation → intent → tool round → result → continue/final | 공개 Harness 대표 경로 [SRC] |\n| PydanticAI | Agent.run/iter → UserPromptNode → ModelRequestNode → CallToolsNode → next request/End | 내부 Agent Graph와 사용자 Graph 구분 [SRC] |\n| OpenAI | Runner/_run_impl → model → ProcessedResponse → tool/side effects → NextStep | 명시적 분기 [SRC] |\n| ADK | Runner/Session → LlmAgent/Flow → processors/model/tools → Events → Runner 저장 | 축약 경로, 구체 버전 구현은 링크 확인 [SRC] |\n| MAF | Agent→RawAgent/Context→ChatClient FunctionInvocation; 별도 Harness/Workflow | 세 반복이 항상 함께 동작한다는 뜻 아님 [SRC/DOC] |\n| Claude Code | CLI→Context→Model/tool/subagent/final→permissions/session/result | 공식 계약의 논리 모델, 내부 함수 추정 금지 [DOC/UNV] |\n| Claude SDK | query/Client→InternalClient→Transport→CLI↔Control→typed messages | 공개 Python 경계와 비공개 CLI 구분 [SRC/UNV] |\n\n**노트:** 기술별 대표 소스 파일은 G. 모든 함수명이 한 호출 스택에 그대로 존재한다는 뜻이 아니다. **근거:** C §§2, 4.1–4.7, 37.1, Appendix A.\n\n","version":"2026-10-31 분석 기준"},{"id":"X02","section":"부록","priority":"핵심","title":"Tool의 7단계·4종 실패·종료 정책 질문","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§5–6.2, 24, 31 F05.","appendixLinks":[],"body":"\n**화면/그림:** `정의→Schema→선택→Parse/Validate→Policy/Approval→실행→Result 기록`의 7단계를 고정한다. 다른 탭에는 다음 두 표를 둔다.\n\n| 실패 | 사례 | 판단 질문 |\n|---|---|---|\n| 형식 | 누락 인자·잘못된 JSON | 모델에 수정 요청할 것인가? |\n| 실행 | 파일 없음·DB Timeout | 제한 Retry/실패 반환이 가능한가? |\n| 정책 | 비인가 자원·금지 Tool | 강제 거절/중단이 필요한가? |\n| 부분 부작용 | 외부 성공 후 응답 유실 | 조회·멱등성·조정 없이 재실행해도 되는가? |\n\n| 종료/중단 | 추가 확인 |\n|---|---|\n| 모델 Final | Output 검증·후처리·저장은 완료됐나? |\n| Tool 결과 Final | 모델 재해석을 생략해도 되는가? |\n| Handoff | 후속 실행 주체와 Context는? |\n| Max steps/예산 | 진행된 작업·저장 상태·알림은? |\n| Guardrail | 이미 발생한 부작용은? |\n| 승인 대기 | 요청 ID·인자·재개 상태는? |\n| 취소 | Task와 실제 외부 실행 모두 중단됐나? |\n| Workflow 수렴 | 남은 메시지·외부 작업은? |\n\n**EndStrategy 탭:** early/graceful/exhaustive를 표시하고 “Final 후보+Function Tool, 검증 실패, 이미 실행 중인 Tool, Streaming일 때의 실제 분기를 고정 버전 소스로 확인”이라는 추적 질문만 둔다. 원문에 없는 상세 결과표를 만들어 채우지 않는다. **근거:** C §§5–6.2, 24, 31 F05.\n\n","version":"2026-10-31 분석 기준"},{"id":"X03","section":"부록","priority":"핵심","title":"병렬성 다섯 종류와 위임의 공유 범위","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§7–8.2, 31 F03/F04/F19/F20.","appendixLinks":[],"body":"\n**화면/그림:** 모델 응답, Tool Task, Child Loop, Workflow, Server의 다섯 레인을 클릭하여 관련 표 행만 보여준다.\n\n| 종류 | 단위 | 확인할 공유/충돌 |\n|---|---|---|\n| Multiple Tool Calls | 한 모델 응답의 여러 요청 | 아직 동시 실행이 아님 |\n| Parallel Tool Execution | 여러 Tool 함수 | 파일·DB·API·Connection Pool |\n| Subagent Parallelism | 독립 모델 Loop | Context 복제·권한·비용·취소 |\n| Workflow Fan-out/in | Node/Executor | 메시지·State·Join·장벽 |\n| Server Concurrency | 사용자/세션 요청 | Tenant·Lock·Rate Limit·Worker |\n\n**기술 비교 탭:** Hermes=스레드 계열+구간/장벽, PydanticAI=async Task+sequential 장벽, OpenAI=async Tool+상한 설정, ADK=Tool batch와 별도 ParallelAgent/TaskGroup, MAF=Function invocation과 Workflow Superstep, Claude Code=문서화된 동시 작업 계약, Claude SDK=CLI의 스케줄 결과 수신. Provider의 다중 호출 허용과 런타임 동시성 상한을 분리한다.\n\n**Subagent 노트:** Child ID·Parent Link, Context·Tool·예산·종료, 반환 계약, 실패·취소 전파, 부모의 결과 재검증, 부모 종료 시 detach/cancel/background 정책을 묻는다. 독립 Context는 강한 OS·테넌트 격리 증거가 아니다. **근거:** C §§7–8.2, 31 F03/F04/F19/F20.\n\n","version":"2026-10-31 분석 기준"},{"id":"X04","section":"부록","priority":"핵심","title":"Memory 여섯 범주와 Context 변환 다섯 방식","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§10–14.1.","appendixLinks":[],"body":"\n**화면/그림:** “저장물” 탭과 “현재 요청 변환” 탭을 분리한다.\n\n| 범주 | 저장 내용·목적 |\n|---|---|\n| Working Context | 현재 모델 입력과 Tool 응답 |\n| Message History | User/Assistant/Tool 대화 |\n| Semantic/Fact Memory | 선별 사실·선호 |\n| Procedural/Skills | 재사용 절차 |\n| Retrieval Index | 원문을 찾는 검색 인덱스 |\n| Durable State/Checkpoint | 중단된 실행의 Node·대기·Queue |\n\n| 변환 | 이점 | 위험/추가 책임 |\n|---|---|---|\n| Sliding Window | 단순한 입력 관리 | 오래된 제약 손실 |\n| Tool Output Pruning | 큰 결과의 중복 축소 | 원문 재검증 경로 |\n| Summarization | 맥락과 길이 절충 | 누락·왜곡 |\n| Structured State | 목적·제약 명시 | Schema·갱신 비용 |\n| Retrieve-on-demand | 필요한 순간 로드 | 검색 품질·지연 |\n\n**노트:** 압축은 삭제 정책이 아니다. 실제 저장 History도 변환될 수 있는지는 구현별 확인이 필요하다. Prompt Cache와 앱 결과 캐시는 별도다. C §11.2의 네 경우(Provider cache, cache control, Prefix 안정화, 앱 캐시)를 구분한다. **근거:** C §§10–14.1.\n\n","version":"2026-10-31 분석 기준"},{"id":"X05","section":"부록","priority":"핵심","title":"Skill 품질과 Tool/MCP/Plugin 신뢰 경계","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§15–15.2, 31 F17/F18.","appendixLinks":[],"body":"\n**화면:** `생성 → 검증 → 평가 → 승인·버전 → 로딩 → 로그 회수·수정`과 `INF · 품질 설계 권고`. **그림:** 절차 문서가 Context에 들어가는 선과, Tool이 외부에 영향을 미치는 선을 분리한다. **조작:** Skill 후보 생성/배포/폐기 단계 강조.\n\n**노트:** Candidate 식별→초안→Schema·경로·권한 검증→샘플 Dry-run/Eval→검토→버전·서명 등록→점진 로딩→오류 회수라는 원문 권고를 설명한다. 모든 제품 기본 자동 기능으로 소개하지 않는다. MCP Server는 프로토콜 노출, Plugin은 호스트 규약 확장이다. 같은 Tool의 중복 등록·이름·정책·감사 경로 충돌을 질문한다. **근거:** C §§15–15.2, 31 F17/F18.\n\n","version":"2026-10-31 분석 기준"},{"id":"X06","section":"부록","priority":"핵심","title":"승인·상태 저장·재개를 묶는 앱 계약","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§17–18.3.","appendixLinks":[],"body":"\n**화면/그림:** `Running→Pending→Authorized→Revalidate→Running/Completed`, 거절·만료·실패 가지를 둔다. `설계 참조 상태도`로 표시한다.\n\n| 결합할 정보 | 목적 |\n|---|---|\n| Request ID | 승인 대상 식별 |\n| User/Role/Scope | 승인 권한 |\n| Arguments·Tool Version Hash | 승인·실행 대상 일치 |\n| Expiry | 오래된 승인 재사용 방지 |\n| Pending State | 재시작 후 대기 복원 |\n| Tool-side Idempotency | 중복 부작용 제한 |\n| Revalidation | 정책·데이터 변경 재검사 |\n\n**제품 수단 탭:** Hermes Approval/Tool Policy, PydanticAI Deferred requests/results, OpenAI RunState, ADK Event/Confirmation/Workflow, MAF Approval/HITL RequestPort/Checkpoint, Claude CLI Prompt/Hook, Claude SDK Permission/callback. 동일 내구성·저장형식 보장으로 읽지 않는다. **근거:** C §§17–18.3.\n\n","version":"2026-10-31 분석 기준"},{"id":"X07","section":"부록","priority":"핵심","title":"실패·경계 사례 24개: 테스트 결과가 아닌 질문","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§31–31.2.","appendixLinks":[],"body":"\n**화면:** 4개 탭 `호출/실행`, `정책/복구`, `Context/지식`, `운영/변경`. 한 번에 6행만 보인다. 각 행 클릭 시 `입장→최초 검사 코드→분기→저장→재실행 위험→설계 선택`의 빈 분석 틀을 연다. **검증 완료 체크 표시는 두지 않는다.**\n\n| ID | 상황 | 확인할 판단 |\n|---|---|---|\n| F01 | 없는 Tool | 오류 반환/중단 |\n| F02 | 형식상 유효한 비인가 DB ID | 업무 인가 위치 |\n| F03 | 2초와 5분 Tool | Timeout·부분 결과 |\n| F04 | 같은 파일 동시 쓰기 | 충돌·장벽 |\n| F05 | Final+Tool 동시 요청 | 출력·도구 정책 |\n| F06 | Validator 연속 실패 | 예산·예외·비용 |\n| F07 | 늦은 Input Guardrail | 이미 발생한 부작용 |\n| F08 | 승인 대상 인자 변경 | 무효화·재검증 |\n| F09 | 승인 뒤 Crash | Replay·멱등성 |\n| F10 | Event 중복 저장 | State Delta 중복 |\n| F11 | Checkpoint 직전 외부 성공 | 완료 조회·중복 실행 |\n| F12 | 복원 중 Tool Schema 변경 | Migration·호환 |\n| F13 | 앞 Timestamp 변경 | Prefix Cache 영향 |\n| F14 | Memory 동시 수정 | Lock·버전·Merge |\n| F15 | FTS에 없는 동의어 | Recall 보완 |\n| F16 | 요약에서 제약 탈락 | 보존 필드·원문 |\n| F17 | 악성 Skill | 신뢰 등급·실행 권한 |\n| F18 | 악성 MCP 응답 | 비신뢰 입력·정제 |\n| F19 | 부모 취소 후 Child 지속 | 소유권·취소·비용 |\n| F20 | 병렬 Agent 사실 충돌 | 근거 대조·병합 |\n| F21 | Stream 단절 | 전송/실행 상태 분리 |\n| F22 | Scheduler 중단·재시작 | 누락·중복·Catch-up |\n| F23 | Provider 변경 | Schema·Context·Cache·Session |\n| F24 | Guardrail 서비스 장애 | Fail closed/open·오류 전달 |\n\n**노트:** 특정 제품이 취약하다는 판정이 아니다. 원문의 F01–F24를 보존한 후속 검증 질문이다. 세 대표 비교 시퀀스(위험 Tool 차단, 병렬 하나 실패, Resume 중 부작용)는 S24/S09/S33에서 회수한다. **근거:** C §§31–31.2.\n\n","version":"2026-10-31 분석 기준"},{"id":"X08","section":"부록","priority":"핵심","title":"참조 인터페이스와 최소 Runtime 의사코드","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§32–33.","appendixLinks":[],"body":"\n**화면:** 인터페이스 선택 탭과 짧은 코드. **조작:** 코드의 1단계와 S38 책임 노드를 연결하여 강조한다. 아래는 C §32.1/§33을 발표용으로 축약한 **[PSEUDO]**다. 실제 SDK에 존재하는 API로 제시하지 않는다.\n\n```text\nModelGateway.generate(request, deadline, trace_ctx)\nContextBuilder.assemble(run_state, token_budget)\nToolCatalog.get_schema(agent_id, permissions) / lookup(name)\nPolicyEngine.authorize_tool(principal, tool_call, context)\nToolExecutor.execute(tool_call, idempotency_key, timeout)\nStateStore.load(run_id) / commit_transition(expected_version, transition)\nRunCoordinator.run(...) / resume(...) / cancel(...)\n```\n\n```text\nstart_run\nrepeat within limits:\n  cancellation/deadline → context → model request → classify response\n  final: validate → commit completion → return\n  handoff: authorize → commit transfer → continue\n  tools: validate → policy → persist pending approval OR proceed\n         partition conflicts → record intent → execute with limits\n         record results → continue\n  fatal/refusal: record stop → terminate\nlimit reached: record stop → terminate\n```\n\n**노트:** 핵심 식별자는 `principal`, `deadline`, `expected_version`, `idempotency_key`다. State commit과 외부 변경의 원자성은 여전히 별개이며 Outbox·조회·조정이 필요할 수 있다. 오류/분산/마이그레이션의 모든 코드를 이 의사코드가 해결한다는 뜻이 아니다. **근거:** C §§32–33.\n\n","version":"2026-10-31 분석 기준"},{"id":"X09","section":"부록","priority":"핵심","title":"선택 매트릭스·운영·호환 체크","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §§20–21, 30, 34–36.","appendixLinks":[],"body":"\n**화면:** `설계 선택`, `연구 적합성`, `Host/Provider 점검` 3개 탭. 본문에서 처음부터 7열 전체 표를 노출하지 않는다.\n\n**설계 선택 탭의 데이터:**\n\n| 요구 | 검토할 설계·원문의 비교 대상 |\n|---|---|\n| Loop 학습/변경 | 명시적 상태 머신: OpenAI/PydanticAI |\n| 정형 결과·검증 | Typed Tool/Output: PydanticAI |\n| 단기 경량 실행 | SDK+최소 Tool: OpenAI |\n| 통합 Runtime | Hermes/Claude Code |\n| Context 합성 | ADK Processors/MAF Providers |\n| Event 중심 기록 | ADK |\n| 장기 분기·재개 | MAF/ADK Graph, 실제 지원 범위 검증 |\n| 정책 경로 분리 | MAF Middleware+독립 인가/Backend |\n| CLI를 앱에 삽입 | Claude Agent SDK |\n| 통합 예약 | Hermes Scheduler/Gateway |\n\n**연구 적합성 탭의 데이터:** C §35를 그대로 사용한다. 범례 `◎ 대표 연구 사례 / ○ 기능·코드 존재 / △ 별도 보완 고려 / — 직접 연구 기준 제한`를 표보다 먼저 표시한다. **성능 점수·미지원 표가 아니다.**\n\n| 연구 영역 | Hermes | PydanticAI | OpenAI | ADK | MAF | Claude Code | Claude SDK |\n|---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|\n| 공개 자체 Loop | ◎ | ◎ | ◎ | ◎ | ◎ | △ | △ |\n| 완성형 Harness | ◎ | ○ | ○ | ○ | ◎ | ◎ | ○ |\n| Typed Validator/Retry | ○ | ◎ | ○ | ○ | ○ | △ | △ |\n| Event/Session | ◎ | ○ | ◎ | ◎ | ◎ | ○ | ○ |\n| 명시적 Graph Workflow | △ | ○* | △ | ◎ | ◎ | △ | △ |\n| Tool 병렬 구현 | ◎ | ◎ | ◎ | ◎ | ◎ | △ | △ |\n| Tool 권한/승인 | ◎ | ◎ | ◎ | ◎ | ◎ | ◎ | ◎ |\n| 파일 Memory/Skill 통합 | ◎ | ○** | ○** | ○** | ◎ | ◎ | ○ |\n| CLI SDK 통신 | — | — | — | — | — | ○ | ◎ |\n| Scheduler/Gateway | ◎ | △ | △ | ○ | ○ | ○ | △ |\n\n`*` 내부 Agent Graph와 별도 Pydantic Graph 구분. `**` 별도 Tool/Harness/앱 구성을 포함하며 기본 자율 Memory·Skill 루프가 Hermes와 같다는 뜻이 아니다.\n\n**Host/Provider 점검 탭:** Auth/Tenant/Session, Credential 분리, Worker·Tool·LLM 동시성, deadline·취소, 영속 상태, 로그 보존; Tool arguments·Structured Output·Stream chunk·취소·토큰·Cache·Retry·병렬 호출. 중앙 Agent와 로컬 Agent+중앙 LLM의 차이는 이 책임이 어느 위치로 이동하는지로 비교하고 용량·속도 숫자는 비워 둔다. **근거:** C §§20–21, 30, 34–36.\n\n","version":"2026-10-31 분석 기준"},{"id":"X10","section":"부록","priority":"핵심","title":"발표자 Q&A와 소스 추적 안내","onScreen":[],"visual":"","buildSteps":["전체 관계","주 경로","경계와 판단"],"speakerNotes":"","sourceRefs":"C §38 · 발표자 Q&A","appendixLinks":[],"body":"\n청중 기본 순회에는 넣지 않고 질문 검색/번호 점프로 연다. C §38의 30개 질문을 다음 답변 기준으로 보존한다. 답변은 원문에서 지지되는 범위로 제한한다.\n\n| Q | 질문 | 답변의 핵심·근거 |\n|---|---|---|\n| 01 | SDK/Framework는 제품명으로 구분? | 실제 실행 소유권·범위를 봄. C §1.1. |\n| 02 | Hermes Intent를 먼저 저장하는 이유? | 요청한 행동과 실행·결과를 연결. 외부 원자성 보장은 별개. §4.1/§33. |\n| 03 | 내부 Graph와 업무 Graph는? | Agent Loop 구현과 사용자 경로 설계의 차이. §4.2/§9. |\n| 04 | NextStep이 Boolean보다 주는 정보? | 종료·계속·제어권 이전 등 분기 의미. §4.3. |\n| 05 | ADK Event 영속화는 누구 책임? | 대표 경로에서 Runner/SessionService, 반복은 Flow. §4.4/§18.3. |\n| 06 | MAF Loop를 왜 나눔? | 모델-Tool, 상위 Agent 재호출, Workflow의 의미·종료가 다름. §4.5. |\n| 07 | Claude SDK에서 비공개 경계는? | Transport/Control은 공개, CLI 핵심 Loop는 별개. §4.7/§29. |\n| 08 | 여러 Tool 요청=병렬 실행? | 아님. 응답 표현과 Scheduler 실행이 다름. §7. |\n| 09 | parallel_tool_calls와 실행 상한은? | Provider 허용과 Runtime 자원 정책. §7.1. |\n| 10 | Hermes Pool과 ADK TaskGroup은 같은 층? | Tool 실행/Agent 실행 단위를 먼저 구분. §7. |\n| 11 | EndStrategy와 부작용은? | Final/Tool 공존 처리·이미 진행된 실행을 확인. §24. |\n| 12 | Handoff와 as-tool? | 다음 담당자로 이전 vs Manager 결과 반환. §8. |\n| 13 | ADK final=전체 완료? | 개별 발화와 업무 완료 범위가 다를 수 있음. §4.4. |\n| 14 | MAF Superstep은? | Executor/메시지/상태 전이의 Workflow 실행 단위. §4.5/§27. |\n| 15 | Cache가 전송을 줄이나? | 동일 Prefix 계산 재사용, 전송 생략 아님. §11. |\n| 16 | Memory 파일과 Transcript? | 선별 장기 정보와 대화 기록. §12. |\n| 17 | FTS와 RAG가 반대인가? | FTS도 RAG 검색 수단이 될 수 있음. §13. |\n| 18 | Skill 생성=검증? | 생성·평가·승인·배포는 별도. §15.1. |\n| 19 | MCP와 Plugin은 대체재? | 프로토콜 경계와 호스트 확장 규약. §15.2. |\n| 20 | 늦은 Guardrail은? | 부작용 선행 가능성·Backend 차단 검토. §16.3. |\n| 21 | Pydantic 검증=인가? | 형식과 실행 권한은 다름. §16.1. |\n| 22 | 승인 후 인자 변경은? | 승인 대상 일치·무효화·재검증. §17. |\n| 23 | Session/RunState/Checkpoint는? | 대화/중단 위치/실행 복원 질문이 다름. §18. |\n| 24 | 재개 후 중복 이체는 왜? | 외부 성공과 Runtime 저장의 장애 틈. §18.1. |\n| 25 | Task 취소=외부 취소? | 외부 Transaction이 계속될 수 있음. §7.2. |\n| 26 | Stream 종료=Run 종료? | 전송·실행·저장·수신은 다름. §20.3. |\n| 27 | 내장 Cron과 외부 Cron? | 제공 경계·Job/Retry/전달 책임 차이. §19. |\n| 28 | 사내 Gateway 호환은? | Tool/출력/Stream/Cache/취소 등 기능별 검증. §21. |\n| 29 | 비공개 Loop 분석은 어디까지? | 공식 계약과 공개 SDK 경계, 내부 추정 금지. §4.6–4.7. |\n| 30 | 첫 인터페이스는 무엇? | Coordinator/Model/Context/Policy/Tool/Store 등 책임에서 선택. §32. |\n\n","version":"2026-10-31 분석 기준"}],"sources":{"H":{"name":"Hermes","links":[{"label":"고정 소스 트리","url":"https://github.com/NousResearch/hermes-agent/tree/v0.22.5"},{"label":"conversation_loop.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/agent/conversation_loop.py"},{"label":"turn_tool_round.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/agent/turn_tool_round.py"},{"label":"turn_tool_validation.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/agent/turn_tool_validation.py"},{"label":"tool_executor.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/agent/tool_executor.py"},{"label":"registry.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/tools/registry.py"},{"label":"prompt_builder.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/agent/prompt_builder.py"},{"label":"prompt_caching.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/agent/prompt_caching.py"},{"label":"context_compressor.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/agent/context_compressor.py"},{"label":"hermes_state.py","url":"https://github.com/NousResearch/hermes-agent/blob/v0.22.5/hermes_state.py"},{"label":"Architecture","url":"https://herme 계 |\n|---|---|---|\n| Hermes | 완성형 Harness가 Context·Tools·Memory·Session·채널·예약을 어떻게 통합하는지 읽는다. | 설정·영속성·정책·코드 범위의 이해 부담. 자율 Skill은 검증 필요. |\n| Claude Code | 작업 환경·지침·권한·Skills를 통합한 제품 계약을 활용한다. | 핵심 엔진 비공개로 저수준 추적·수정 제약. |\n| PydanticAI | 내부 Graph와 검증·Retry·종료·Dependencies의 계약을 함께 설계한다. | 타입이 사실을 보증하지 않음. 장기 저장·Host·외부 권한은 별도. |\n| OpenAI | 명시적 Runner/NextStep으로 계속·종료·이관을 구분한다. | 완성형 플랫폼 전체가 아님. Guardrail 적용 범위 확인 필요. |\n| Claude SDK | CLI Harness를 앱에 연결하고 공개 통신·수명을 관리한다. | 내부 Loop 소유권과 Host의 자원·격리 책임을 혼동하면 안 됨. |\n| ADK | Event와 Session/State 변화로 실행을 관찰한다. | 순서·중복·Branch·Resume·완료 범위 이해 필요. |\n| MAF | Pipeline·정책·모델-Tool·Harness·Workflow 책임을 합성한다. | 중첩 순서·예외 전파가 복잡. 외부 부작용은 별도 계약. |\n\n근거: C §§23–30. 위 장단점은 원문의 [INF] 해석이며 도입 성과가 아니다.\n\n## E-2. PydanticAI의 이점을 타입 검증 한 줄로 끝내지 않기\n\n“검증을 잘한다” 대신 다음 연결을 설명한다. Node 경계로 모델 요청/도구 처리/종료를 추적하고, Validator 실패를 모델 피드백과 예산으로 연결하며, EndStrategy가 Final/Tool 공존 처리를 다르게 한다. `sequential` 장벽은 실행 순서 제약을 표현한다. Dependencies는 실행 자원과 테스트 대체를 분리하는 수단이다. Capabilities/Hooks는 개입 위치를 제공하되 도메인 정책·권한·저장은 앱이 설계해야 한다. 이 모든 선택을 “자동으로 도메인 정답을 보장한다”로 요약하지 않는다. 근거: C §§4.2, 5–7, 16, 24.\n\n## E-3. 반도체 사례에서 선별할 시사점\n\n- **데이터 기준:** 같은 Lot이라도 기간·분모·Snapshot이 다르면 조회값·예측 입력이 달라진다. 근거 ID를 Tool 결과와 보고서에 연결하는 설계를 검토한다.\n- **절차 신선도:** SOP 개정은 안정 Prefix·Memory·Skill의 갱신 시점과 연결된다. 캐시 hit와 최신 절차 사용을 다른 평가 축으로 본다.\n- **권한:** Schema상 유효한 Lot ID도 비인가일 수 있다. Tool Backend·DB 자격증명에서 실제 경계를 강제한다.\n- **병렬:** 독립 조회의 속도보다 데이터 의존성·같은 시점·공유 자원 충돌 여부가 먼저다.\n- **승인/재개:** 승인한 보고서 버전과 실행할 버전, 외부 발행 완료 여부를 확인한다. 같은 Tool을 다시 호출해도 되는지는 도구 계약이다.\n- **품질:** 오류율 계산은 결정적 정답으로, 설명은 근거 충실도·가설 구분으로, 예측은 정의된 target/평가 조건으로 판단한다. 이번 문서는 실제 데이터·예측 방법·정확도를 확정하지 않는다.\n\n이는 C의 원리를 적용한 [INF] 설계 질문이다. 일곱 장마다 반복하지 않고 S06/S09/S16/S20/S31/S33/S37에서 필요한 지점만 사용한다.\n\n## E-4. 마지막에 설명할 열 가지 결론의 회수\n\nLoop 소유권, 비배타적 SDK/Framework, 모델 제안과 인가의 차이, 병렬성의 층, 저장물의 차이, Prefix 계산 재사용, Guardrail의 범위, Resume와 Exactly-once 구분, 공개 SDK와 비공개 CLI 경계, 요구 기반 선택이라는 C §39의 열 가지 결론을 S40의 세 문장에 묶는다. 화면에 열 줄을 한꺼번에 추가하지 않는다.\
