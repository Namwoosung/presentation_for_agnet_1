<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Framework Seminar II</title><style>/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}
/* Light 16:9 conference presentation. No network assets. */
:root{--stage-bg:#E6EBF2;--slide-bg:#F7F9FC;--text:#17243A;--muted:#526279;--line:#D9E2ED;--model:#1D63B7;--runtime:#7545AA;--tool:#147E61;--state:#B66813;--risk:#B6384B}

.build.shown{opacity:1}
.build.past{opacity:.65}
.overview .build{opacity:1!important}
.edge-label text{paint-order:stroke;stroke:#F7F9FC;stroke-width:7px;stroke-linejoin:round}

/* Space is the sole audience progression input. Presses during the transition
   are discarded; held keys never advance twice. No wrap after the final build. */
const slides=[...document.querySelectorAll('.slide')];
const stage=document.querySelector('.deck-stage');
const params=new URLSearchParams(location.search);
const initial=Number(params.get('slide')||1);
let index=Number.isInteger(initial)?Math.min(slides.length-1,Math.max(0,initial-1)):0;
let step=0,held=false,locked=false;
const overview=DECK_OVERVIEW;
if(overview)document.body.classList.add('overview');
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*scale)/2}px,${(innerHeight-1080*scale)/2}px) scale(${scale})`;}
function render(){
 slides.forEach((slide,i)=>{slide.classList.toggle('active',i===index);slide.setAttribute('aria-hidden',String(i!==index));});
 const slide=slides[index],count=Number(slide.dataset.steps);
 slide.querySelectorAll('[data-build]').forEach(el=>{let k=Number(el.dataset.build);el.classList.toggle('shown',k<=step);el.classList.toggle('past',k<step);});
 const finished=index===slides.length-1&&(overview||step===count-1);
 slide.querySelector('.build-counter').textContent=`${overview?'전체 화면':`build ${step+1}/${count}`}    ${finished?'END':'SPACE'}`;
 window.deckState={slideId:slide.dataset.id,slideIndex:index,stepIndex:step,stepCount:count,sourceRefs:metadata[index].sources,mode:overview?'overview':'presentation'};
 document.title=`${slide.dataset.id} · Agent Framework Seminar II`;
}
addEventListener('keydown',event=>{
 if(event.code!=='Space')return;
 if(/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable)return;
 event.preventDefault();if(event.repeat||held||locked)return;
 held=true;locked=true;setTimeout(()=>locked=false,300);
 if(overview){if(index<slides.length-1)index++;}
 else if(step<Number(slides[index].dataset.steps)-1)step++;
 else if(index<slides.length-1){index++;step=0;}
 render();
});
addEventListener('keyup',event=>{if(event.code==='Space')held=false;});
addEventListener('blur',()=>{held=false;});addEventListener('resize',fit);
fit();render();
</script></body></html>
